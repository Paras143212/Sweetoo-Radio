<!-- =========================================
     JAVASCRIPT: RADIO LOGIC & FAVORITES
========================================= -->
<script>
    const countrySelect = document.getElementById('countrySelect');
    const stationSelect = document.getElementById('stationSelect');
    const favSelect = document.getElementById('favSelect');
    const favCountrySelect = document.getElementById('favCountrySelect');
    
    const radioPlayer = document.getElementById('radioPlayer');
    const stationLogo = document.getElementById('stationLogo');
    const favStationBtn = document.getElementById('favStationBtn');
    const favCountryBtn = document.getElementById('favCountryBtn');

    // Load favorites from LocalStorage
    let favStations = JSON.parse(localStorage.getItem('sweetoo_favorites')) || [];
    let favCountries = JSON.parse(localStorage.getItem('sweetoo_fav_countries')) || [];
    let currentStation = null; 

    // Update Station Favorites Dropdown
    function updateFavStationDropdown() {
        if (favStations.length === 0) {
            favSelect.innerHTML = '<option value="">No favorite stations yet 🤍</option>';
        } else {
            favSelect.innerHTML = '<option value="">⭐ Select a Favorite Station</option>';
            favStations.forEach((fav, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.text = fav.name;
                favSelect.appendChild(option);
            });
        }
    }

    // Update Country Favorites Dropdown
    function updateFavCountryDropdown() {
        if (favCountries.length === 0) {
            favCountrySelect.innerHTML = '<option value="">No favorite countries yet 🤍</option>';
        } else {
            favCountrySelect.innerHTML = '<option value="">⭐ Select a Favorite Country</option>';
            favCountries.forEach((country) => {
                const option = document.createElement('option');
                option.value = country.name; 
                option.text = country.text; // Includes the flag emoji
                favCountrySelect.appendChild(option);
            });
        }
    }

    // Check if the current station is saved
    function checkStationFavoriteStatus() {
        if (!currentStation) return;
        
        const isSaved = favStations.some(f => f.url === currentStation.url);
        
        if (isSaved) {
            favStationBtn.innerHTML = '❤️ Station Saved';
            favStationBtn.classList.add('saved');
        } else {
            favStationBtn.innerHTML = '🤍 Save Station';
            favStationBtn.classList.remove('saved');
        }
        favStationBtn.style.display = 'inline-block';
    }

    // Check if the current country is saved
    function checkCountryFavoriteStatus() {
        const selectedCountry = countrySelect.value;
        if (!selectedCountry) {
            favCountryBtn.style.display = 'none';
            return;
        }
        
        favCountryBtn.style.display = 'block';
        const isSaved = favCountries.some(c => c.name === selectedCountry);
        
        if (isSaved) {
            favCountryBtn.innerHTML = '❤️';
            favCountryBtn.classList.add('saved');
        } else {
            favCountryBtn.innerHTML = '🤍';
            favCountryBtn.classList.remove('saved');
        }
    }

    // Save/Remove Favorite Station
    favStationBtn.addEventListener('click', () => {
        if (!currentStation) return;
        
        const existingIndex = favStations.findIndex(f => f.url === currentStation.url);
        
        if (existingIndex > -1) {
            favStations.splice(existingIndex, 1); // Remove if already saved
        } else {
            favStations.push(currentStation); // Add if new
        }
        
        localStorage.setItem('sweetoo_favorites', JSON.stringify(favStations));
        updateFavStationDropdown();
        checkStationFavoriteStatus();
    });

    // Save/Remove Favorite Country
    favCountryBtn.addEventListener('click', () => {
        const selectedCountryName = countrySelect.value;
        if (!selectedCountryName) return;

        const selectedCountryText = countrySelect.options[countrySelect.selectedIndex].text;
        const existingIndex = favCountries.findIndex(c => c.name === selectedCountryName);

        if (existingIndex > -1) {
            favCountries.splice(existingIndex, 1); // Remove if already saved
        } else {
            favCountries.push({ name: selectedCountryName, text: selectedCountryText }); // Add if new
        }

        localStorage.setItem('sweetoo_fav_countries', JSON.stringify(favCountries));
        updateFavCountryDropdown();
        checkCountryFavoriteStatus();
    });

    // Play Station Helper Function
    function playStation(name, url, logo) {
        currentStation = { name, url, logo };
        radioPlayer.src = url;
        radioPlayer.play();

        if (logo && logo.trim() !== "") {
            stationLogo.src = logo;
        } else {
            // Generate a placeholder logo with the station's initials
            stationLogo.src = `[https://ui-avatars.com/api/?name=$](https://ui-avatars.com/api/?name=$){encodeURIComponent(name)}&background=random&color=fff&size=150`; 
        }
        stationLogo.style.display = 'block';
        checkStationFavoriteStatus();
    }

    // Play from Favorite Stations Dropdown
    favSelect.addEventListener('change', function() {
        if (this.value !== "") {
            const fav = favStations[this.value];
            playStation(fav.name, fav.url, fav.logo);
            
            // Reset main dropdowns to avoid confusion
            countrySelect.selectedIndex = 0;
            favCountrySelect.selectedIndex = 0;
            favCountryBtn.style.display = 'none';
            stationSelect.innerHTML = '<option value="">🔒 Playing from Favorites</option>';
            stationSelect.disabled = true;
        }
    });

    // Select Country from Favorite Countries Dropdown
    favCountrySelect.addEventListener('change', function() {
        if (this.value !== "") {
            countrySelect.value = this.value;
            // Manually trigger the change event to fetch stations for this country
            countrySelect.dispatchEvent(new Event('change'));
        }
    });

    // Helper: Convert Country Code to Emoji Flag
    function getFlagEmoji(countryCode) {
        if (!countryCode) return '🌍';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    // API 1: Fetch All Countries
    function loadCountries() {
        fetch('[https://de1.api.radio-browser.info/json/countries](https://de1.api.radio-browser.info/json/countries)')
            .then(response => response.json())
            .then(data => {
                countrySelect.innerHTML = '<option value="">-- Select a Country --</option>';
                data.forEach(country => {
                    if(country.name && country.stationcount > 0) {
                        const option = document.createElement('option');
                        option.value = country.name;
                        
                        const flag = getFlagEmoji(country.iso_3166_1);
                        option.text = `${flag} ${country.name} (${
