<!-- =========================================
     JAVASCRIPT: RADIO LOGIC & FAVORITES
========================================= -->
<script>
    // Document Elements
    const countrySelect = document.getElementById('countrySelect');
    const stationSelect = document.getElementById('stationSelect');
    const favSelect = document.getElementById('favSelect');
    const favCountrySelect = document.getElementById('favCountrySelect');
    
    const radioPlayer = document.getElementById('radioPlayer');
    const stationLogo = document.getElementById('stationLogo');
    
    const favBtn = document.getElementById('favBtn');
    const favCountryBtn = document.getElementById('favCountryBtn');

    // Local Storage State Variables
    let favoriteStations = JSON.parse(localStorage.getItem('sweetoo_favorites')) || [];
    let favoriteCountries = JSON.parse(localStorage.getItem('sweetoo_fav_countries')) || [];
    
    let currentStation = null; 
    let currentCountry = null;

    // -----------------------------------------
    //  FAVORITE DROPDOWN UPDATERS
    // -----------------------------------------
    
    function updateFavStationDropdown() {
        if (favoriteStations.length === 0) {
            favSelect.innerHTML = '<option value="">No favorite stations saved 🤍</option>';
        } else {
            favSelect.innerHTML = '<option value="">⭐ Select a Favorite Station</option>';
            
            favoriteStations.forEach((fav, index) => {
                const option = document.createElement('option');
                option.value = index; 
                option.text = fav.name;
                favSelect.appendChild(option);
            });
        }
    }

    function updateFavCountryDropdown() {
        if (favoriteCountries.length === 0) {
            favCountrySelect.innerHTML = '<option value="">No favorite countries saved 🤍</option>';
        } else {
            favCountrySelect.innerHTML = '<option value="">🌍 Select a Favorite Country</option>';
            
            favoriteCountries.forEach((country) => {
                const option = document.createElement('option');
                option.value = country.name; 
                option.text = country.text;
                favCountrySelect.appendChild(option);
            });
        }
    }

    // -----------------------------------------
    //  CHECK FAVORITE STATUS
    // -----------------------------------------
    
    function checkFavoriteStationStatus() {
        if (!currentStation) return;
        
        const isSaved = favoriteStations.some(f => f.url === currentStation.url);
        
        if (isSaved) {
            favBtn.innerHTML = '❤️ Station Saved';
            favBtn.classList.add('saved');
        } else {
            favBtn.innerHTML = '🤍 Save Station';
            favBtn.classList.remove('saved');
        }
        
        favBtn.style.display = 'block';
    }

    function checkFavoriteCountryStatus() {
        if (!currentCountry || !currentCountry.name) {
            favCountryBtn.disabled = true;
            favCountryBtn.innerHTML = '🤍';
            favCountryBtn.classList.remove('saved');
            return;
        }
        
        favCountryBtn.disabled = false;
        
        const isSaved = favoriteCountries.some(c => c.name === currentCountry.name);
        
        if (isSaved) {
            favCountryBtn.innerHTML = '❤️';
            favCountryBtn.classList.add('saved');
        } else {
            favCountryBtn.innerHTML = '🤍';
            favCountryBtn.classList.remove('saved');
        }
    }

    // -----------------------------------------
    //  FAVORITE BUTTON CLICK EVENTS
    // -----------------------------------------
    
    favBtn.addEventListener('click', () => {
        if (!currentStation) return;
        
        const existingIndex = favoriteStations.findIndex(f => f.url === currentStation.url);
        
        if (existingIndex > -1) {
            favoriteStations.splice(existingIndex, 1); // Remove if exists
        } else {
            favoriteStations.push(currentStation); // Add if new
        }
        
        localStorage.setItem('sweetoo_favorites', JSON.stringify(favoriteStations));
        updateFavStationDropdown();
        checkFavoriteStationStatus();
    });

    favCountryBtn.addEventListener('click', () => {
        if (!currentCountry) return;
        
        const existingIndex = favoriteCountries.findIndex(c => c.name === currentCountry.name);
        
        if (existingIndex > -1) {
            favoriteCountries.splice(existingIndex, 1); // Remove if exists
        } else {
            favoriteCountries.push(currentCountry); // Add if new
        }
        
        localStorage.setItem('sweetoo_fav_countries', JSON.stringify(favoriteCountries));
        updateFavCountryDropdown();
        checkFavoriteCountryStatus();
    });

    // -----------------------------------------
    //  PLAYER LOGIC & BACKGROUND PLAY (MEDIA SESSION API)
    // -----------------------------------------
    
    function playStation(name, url, logo) {
        currentStation = { name, url, logo };
        
        radioPlayer.src = url;
        radioPlayer.play();

        // Determine the logo to show (Original or Auto-generated)
        const displayLogo = (logo && logo.trim() !== "") 
            ? logo 
            : `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff&size=512`;

        stationLogo.src = displayLogo;
        stationLogo.style.display = 'block';
        checkFavoriteStationStatus();

        // --- MEDIA SESSION API FOR BACKGROUND PLAY & LOCK SCREEN ---
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: name,
                artist: 'Sweetoo Radio',
                album: 'Live World Music',
                artwork: [
                    { src: displayLogo, sizes: '96x96', type: 'image/png' },
                    { src: displayLogo, sizes: '128x128', type: 'image/png' },
                    { src: displayLogo, sizes: '192x192', type: 'image/png' },
                    { src: displayLogo, sizes: '256x256', type: 'image/png' },
                    { src: displayLogo, sizes: '384x384', type: 'image/png' },
                    { src: displayLogo, sizes: '512x512', type: 'image/png' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', function() {
                radioPlayer.play();
            });

            navigator.mediaSession.setActionHandler('pause', function() {
                radioPlayer.pause();
            });
        }
    }

    favCountrySelect.addEventListener('change', function() {
        if (this.value !== "") {
            countrySelect.value = this.value;
            countrySelect.dispatchEvent(new Event('change'));
        }
    });

    favSelect.addEventListener('change', function() {
        if (this.value !== "") {
            const fav = favoriteStations[this.value];
            playStation(fav.name, fav.url, fav.logo);
            
            // Reset main dropdowns
            countrySelect.selectedIndex = 0;
            currentCountry = null;
            checkFavoriteCountryStatus();
            
            stationSelect.innerHTML = '<option value="">🔒 Playing from Favorites</option>';
            stationSelect.disabled = true;
        }
    });

    // Helper Function: Convert Country Code to Flag Emoji
    function getFlagEmoji(countryCode) {
        if (!countryCode) return '🌍';
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    // -----------------------------------------
    //  API FETCH OPERATIONS
    // -----------------------------------------
    
    // API 1: Load All Countries
    function loadCountries() {
        fetch('https://de1.api.radio-browser.info/json/countries')
            .then(response => response.json())
            .then(data => {
                countrySelect.innerHTML = '<option value="">-- Select a Country --</option>';
                
                data.forEach(country => {
                    if(country.name && country.stationcount > 0) {
                        const option = document.createElement('option');
                        option.value = country.name;
                        
                        const flag = getFlagEmoji(country.iso_3166_1);
                        option.text = `${flag} ${country.name} (${country.stationcount})`;
                        
                        countrySelect.appendChild(option);
                    }
                });
            })
            .catch(error => {
                countrySelect.innerHTML = '<option value="">❌ Error loading data</option>';
            });
    }

    // API 2: Load Stations by Selected Country
    countrySelect.addEventListener('change', function() {
        const selectedCountryName = this.value;
        const selectedOption = this.options[this.selectedIndex];
        
        favSelect.selectedIndex = 0; // Reset favorite station dropdown

        if (selectedCountryName) {
            
            currentCountry = {
                name: selectedCountryName,
                text: selectedOption.text
            };
            
            checkFavoriteCountryStatus();

            stationSelect.disabled = false;
            stationSelect.innerHTML = '<option value="">⏳ Loading stations...</option>';
            
            fetch(`https://de1.api.radio-browser.info/json/stations/bycountry/${encodeURIComponent(selectedCountryName)}`)
                .then(response => response.json())
                .then(stations => {
                    stationSelect.innerHTML = '<option value="">-- Select a Station --</option>';
                    
                    stations.forEach(station => {
                        if (station.name && station.url_resolved) {
                            const option = document.createElement('option');
                            option.value = station.url_resolved;
                            option.text = station.name;
                            
                            option.setAttribute('data-logo', station.favicon); 
                            option.setAttribute('data-name', station.name);
                            
                            stationSelect.appendChild(option);
                        }
                    });
                })
                .catch(error => {
                    stationSelect.innerHTML = '<option value="">❌ Error loading stations</option>';
                });
        } else {
            currentCountry = null;
            checkFavoriteCountryStatus();
            
            stationSelect.innerHTML = '<option value="">🔒 Select a country first</option>';
            stationSelect.disabled = true;
        }
    });

    // Play Station when selected from list
    stationSelect.addEventListener('change', function() {
        if(this.value) {
            const selectedOption = this.options[this.selectedIndex];
            playStation(
                selectedOption.getAttribute('data-name'), 
                this.value, 
                selectedOption.getAttribute('data-logo')
            );
        }
    });

    // Initialize App on Load
    window.onload = () => {
        loadCountries();
        updateFavStationDropdown(); 
        updateFavCountryDropdown();
    };
</script>

<!-- =========================================
     JAVASCRIPT: PWA SERVICE WORKER & INSTALL
========================================= -->
<script>
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('Sweetoo Radio PWA ServiceWorker successfully registered! 😎', registration.scope);
                })
                .catch(error => {
                    console.log('ServiceWorker registration failed:', error);
                });
        });
    }

    // 2. Custom App Install Prompt Logic
    let deferredPrompt;
    const installAppBtn = document.getElementById('installAppBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default browser install popup
        e.preventDefault();
        
        deferredPrompt = e;
        
        // Show our custom Install Button
        installAppBtn.style.display = 'block';
    });

    installAppBtn.addEventListener('click', async () => {
        if (deferredPrompt !== null) {
            
            // Show the actual browser install prompt
            deferredPrompt.prompt();
            
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('User installed Sweetoo Radio!');
                installAppBtn.style.display = 'none';
            }
            
            deferredPrompt = null;
        }
    });

    // Hide button if the app is successfully installed
    window.addEventListener('appinstalled', () => {
        installAppBtn.style.display = 'none';
        console.log('App is already installed');
    });
</script>
